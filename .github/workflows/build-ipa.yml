name: Build TraceAR iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run Unit Tests on Simulator
        run: |
          SIM_ID=$(xcrun simctl list devices available iPhone -j | python3 -c "import sys, json; devs=[d for r in json.load(sys.stdin)['devices'].values() for d in r if d.get('isAvailable') and 'iPhone' in d.get('name','')]; print(devs[0]['udid'])")
          echo "Using Simulator UDID: $SIM_ID"
          xcodebuild test \
            -project TraceAR.xcodeproj \
            -scheme TraceAR \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Unsigned Release App (arm64 iOS)
        run: |
          xcodebuild clean build \
            -project TraceAR.xcodeproj \
            -scheme TraceAR \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA for Sideloadly / AltStore
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TraceAR.app Payload/
          zip -qry TraceAR.ipa Payload

      - name: Upload TraceAR.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TraceAR-iOS-IPA
          path: TraceAR.ipa
          if-no-files-found: error
